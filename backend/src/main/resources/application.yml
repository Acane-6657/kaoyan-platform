server:
  # 8080 已被本机其他 Java 服务占用，改用 8081
  port: ${SERVER_PORT:8081}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  profiles:
    active: dev
  application:
    name: kaoyan-platform
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.kaoyan.module
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务自定义配置
kaoyan:
  jwt:
    # 生产环境务必通过环境变量 KAAYAN_JWT_SECRET 覆盖
    secret: ${KAAYAN_JWT_SECRET:kaoyan-platform-default-secret-key-change-me-please-2026}
    expire-minutes: 720
    header: Authorization
    prefix: "Bearer "
  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:deepseek-chat}
    timeout-seconds: 60
    max-retry: 1
  kafka:
    diagnosis-topic: diagnosis-topic
  upload:
    dir: ${KAAYAN_UPLOAD_DIR:./uploads}

knife4j:
  enable: true
